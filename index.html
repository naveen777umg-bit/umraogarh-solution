<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f7f6;
    color:#222;
}

header{
    background:linear-gradient(135deg,#087f5b,#19a66f);
    color:white;
    text-align:center;
    padding:45px 20px;
    border-radius:0 0 35px 35px;
}

header h1{
    font-size:42px;
    letter-spacing:2px;
}

header p{
    font-size:23px;
    margin-top:12px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px 18px;
}

.card{
    background:white;
    margin:20px 0;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 18px rgba(0,0,0,.10);

}

.card h2{
    color:#087f5b;
    margin-bottom:18px;
}

.doctor-img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:50%;
    border:6px solid #19a66f;
    margin-bottom:15px;
}

.button{
    display:block;
    text-decoration:none;
    color:white;
    padding:16px;
    margin:14px 0;
    border-radius:15px;
    font-size:20px;
    font-weight:bold;
}

.call{
    background:#1677ee;
}

.whatsapp{
    background:#20c76b;
}

.complaint{
    background:#fff3cd;
    border-left:6px solid #ff9800;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.gallery img{
    width:100%;
    height:160px;
    object-fit:cover;
    border-radius:14px;
}

footer{
    margin-top:30px;
    background:#087f5b;
    color:white;
    text-align:center;
    padding:25px;
    border-radius:25px 25px 0 0;
}

.small{
    margin-top:8px;
    font-size:14px;
}
</style>
</head>
